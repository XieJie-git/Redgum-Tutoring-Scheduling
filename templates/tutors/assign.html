{% extends "base.html" %}

{% block content %}
<h2 class="mb-4">Assign Tutor to Student</h2>

<!-- Flash message 提示框，用于成功/错误提示 -->
{% with messages = get_flashed_messages() %}
{% if messages %}
    {% for msg in messages %}
        <div class="alert alert-info">{{ msg }}</div>
    {% endfor %}
{% endif %}
{% endwith %}

<!-- Assign tutor form -->
<form method="POST" action="#" class="mt-4 bg-white p-4 shadow-sm rounded">
    <div class="mb-3">
        <label for="student" class="form-label">Select Student</label>
        <select class="form-select" id="student" name="student_id" required>
            <option value="">-- Choose a student --</option>
            {% for student in students %}
            <option value="{{ student.id }}"
                {% if pre_select_student_id == student.id %}selected{% endif %}>
                {{ student.name }} (Year {{ student.year_level }})
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label for="tutor" class="form-label">Select Tutor</label>
        <select class="form-select" id="tutor" name="tutor_id" required>
            <option value="">-- Choose a tutor --</option>
            {% for tutor in tutors %}
            <option value="{{ tutor.id }}">{{ tutor.name }} - {{ tutor.specialty }}</option>
            {% endfor %}
        </select>
    </div>

    <button type="submit" class="btn btn-success">Confirm Allocation</button>
    <!-- Remove allocation button (optional, no backend logic yet) -->
    <button type="button" class="btn btn-outline-danger float-end">Remove Current Allocation</button>
</form>
{% endblock %}
